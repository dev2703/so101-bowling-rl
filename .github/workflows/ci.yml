name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4

      - name: Install headless OpenGL (OSMesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libgl1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (CPU CI without triton to avoid OSMesa LLVM SIGSEGV)
        run: uv sync --frozen --extra dev --no-install-package triton

      - name: Run test suite
        run: |
          uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('triton') is None, 'triton must be absent on CPU OSMesa CI'"
          uv run --no-sync pytest -m "not hardware"
